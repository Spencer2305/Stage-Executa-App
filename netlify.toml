[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  SKIP_ENV_VALIDATION = "true"
  NETLIFY_DEPLOY_TIMESTAMP = "2024-07-12-22-00"
  NEXT_SHARP_PATH = ""
  NEXT_PUBLIC_VERCEL_URL = ""

# Plugin will be configured through Netlify UI

[functions]
  node_bundler = "esbuild"

# API routes redirect
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/___netlify-handler"
  status = 200

# Fallback for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
